<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animate Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f5f0ff;--bg2:#fbeeff;--card:rgba(255,255,255,.82);--tx:#1e1b2e;--mut:#6b6880;--pr:#9333ea;--pr2:#4f46e5;--ln:rgba(168,85,247,.25);--in:#f8f5ff;--dn:#e11d48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#15101f;--bg2:#1d1230;--card:rgba(36,28,56,.85);--tx:#f1ecfb;--mut:#a79fc2;--ln:rgba(192,132,252,.3);--in:#2a2040}}
:root[data-theme="dark"]{--bg1:#15101f;--bg2:#1d1230;--card:rgba(36,28,56,.85);--tx:#f1ecfb;--mut:#a79fc2;--ln:rgba(192,132,252,.3);--in:#2a2040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;flex-direction:column}
.serif{font-family:'Playfair Display',Georgia,serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.hidden{display:none!important}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(147,51,234,.5)}
.btn.sec{background:var(--card);color:var(--pr);border:1px solid var(--ln)}
.btn.dng{background:var(--dn)}
.btn.sm{padding:6px 12px;font-size:12px}
input,textarea,select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--ln);background:var(--in)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
select.lang{width:auto;padding:7px 10px;border-radius:999px;font-size:13px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
/* AUTH */
#auth{flex:1;display:grid;place-items:center;padding:20px;position:relative}
.auth-box{width:100%;max-width:860px;display:grid;grid-template-columns:5fr 7fr;background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -12px rgba(126,34,206,.25);backdrop-filter:blur(20px)}
.brand{background:linear-gradient(150deg,#9333ea,#6b21a8 60%,#581c87);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.brand h2{font-size:28px;line-height:1.25;margin:10px 0;font-weight:400}
.brand p{opacity:.8;font-size:14px;margin:0}
.form{padding:36px}
.form h1{margin:0 0 4px;font-size:26px}
.tabs{display:flex;background:var(--in);padding:4px;border-radius:14px;margin:18px 0 6px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--pr);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.err{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:10px 12px;border-radius:12px;font-size:13px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* NAV */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding:14px 16px 0}
nav{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 22px;border-radius:999px;background:linear-gradient(120deg,var(--card),rgba(233,213,255,.35));border:1px solid var(--ln);backdrop-filter:blur(24px) saturate(190%);box-shadow:0 20px 50px -10px rgba(168,85,247,.25),inset 0 2px 4px rgba(255,255,255,.5)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);font-size:17px;font-weight:600;letter-spacing:.04em}
.logo svg{width:38px;height:38px;animation:fl 6s ease-in-out infinite}
.logo i{color:var(--pr);font-weight:400}
.navr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tg{display:inline-flex;align-items:center;gap:8px;color:var(--tx);text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px 7px 8px;border-radius:999px;background:var(--in);border:1px solid var(--ln);transition:transform .15s,border-color .15s}
.tg:hover{color:var(--pr);border-color:var(--pr);transform:translateY(-1px)}
.tg svg{width:22px;height:22px;flex:none}
select.lang{background:var(--in);border:1px solid var(--ln);font-weight:500;cursor:pointer}
.navr .btn{white-space:nowrap}
@keyframes fl{50%{transform:translateY(-4px) rotate(5deg)}}
/* MAIN */
main{flex:1;max-width:1150px;width:100%;margin:0 auto;padding:36px 16px}
.hero{text-align:center;margin-bottom:28px}
.hero{padding:18px 0 6px}
.hero h1{font-size:clamp(38px,8vw,72px);margin:0 0 14px;font-weight:600;letter-spacing:-.01em;line-height:1.05;background:linear-gradient(100deg,#7e22ce,#a855f7 45%,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero p{display:inline-block;color:var(--pr);background:var(--card);border:1px solid var(--ln);padding:8px 20px;border-radius:999px;margin:0 auto 26px;font-size:15px;font-weight:500;box-shadow:0 8px 24px -10px rgba(147,51,234,.35)}
.search{max-width:460px;margin:auto;padding-left:16px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.ic{background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.ic iframe{width:100%;height:150px;border:0;background:var(--in)}
.ic .b{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.ic .n{font-weight:600;font-size:14px}
.ic .a{font-size:12px;color:var(--mut)}
.ic .act{display:flex;gap:6px;margin-top:8px}
.ic .act .btn{flex:1}
.empty{text-align:center;color:var(--mut);padding:50px 0}
/* MODAL / TOAST */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,10,40,.5);display:grid;place-items:center;padding:16px}
.mb{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg1);border-radius:24px;padding:26px}
.mb h3{margin:0 0 4px;font-size:22px}
.prev{height:140px;border-radius:14px;overflow:hidden;margin-top:12px;border:1px dashed var(--ln)}
.prev iframe{width:100%;height:100%;border:0;background:var(--in)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e1b2e;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
/* FOOTER */
footer{padding:0 16px 24px}
.ft{max-width:1150px;margin:auto;background:linear-gradient(120deg,var(--card),rgba(192,132,252,.2));border:1px solid var(--ln);border-radius:28px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ft p{margin:4px 0 0;color:var(--mut);font-size:13px;max-width:420px}
.tgb{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.logo{white-space:nowrap}
html{-webkit-text-size-adjust:100%}
@media(max-width:720px){.auth-box{grid-template-columns:1fr}.brand{display:none}.form{padding:26px}
header{padding:10px 10px 0}
nav{flex-wrap:wrap;border-radius:24px;padding:10px 12px;gap:8px}
.navr{display:contents}
.logo{order:0;flex:1;font-size:15px;gap:8px}.logo svg{width:30px;height:30px}
select.lang{order:1;font-size:13px}
#uname{order:1}
nav::after{content:"";order:2;flex-basis:100%;height:0}
.navr>.btn.sec:not(#uname),.navr>.btn:not(.sec),.navr>.tg{order:3}
.navr>.btn.sec:not(#uname){flex:1;padding:9px 10px;font-size:13px}
.navr>.btn:not(.sec){flex:1;padding:9px 10px;font-size:13px;text-align:center}
.tg{padding:6px}.tg span{display:none}
main{padding:24px 12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ic iframe{height:120px}
.ft{padding:20px;border-radius:22px}
.mb{padding:20px;border-radius:20px}
input,textarea{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

["Flash bolt",'<svg viewBox="0 0 24 24" width="64" height="64" class="z"><path fill="#FACC15" stroke="#CA8A04" stroke-width="1" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>\n<style>.z{animation:f 1.1s steps(2,end) infinite}@keyframes f{50%{opacity:.25;transform:scale(.92)}}</style>'],
["Spinning star",'<svg viewBox="0 0 24 24" width="64" height="64" class="st"><path fill="#6366F1" d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>\n<style>.st{animation:sp 3s ease-in-out infinite}@keyframes sp{50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg)}}</style>'],
["Draw check",'<svg viewBox="0 0 52 52" width="64" height="64"><circle cx="26" cy="26" r="23" fill="none" stroke="#10B981" stroke-width="3"/><path class="c" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M15 27l8 8 14-16"/></svg>\n<style>.c{stroke-dasharray:40;stroke-dashoffset:40;animation:d 1.8s ease infinite}@keyframes d{60%,100%{stroke-dashoffset:0}}</style>']
].map((x,i)=>({id:'seed'+i,name:x[0],code:x[1],author:'Animate Icons',owner:null,ts:0}));
const icons=()=>SEED.concat(S.get('ai_icons',[]));

/* ---------- i18n apply ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll('[data-lang]').forEach(s=>{s.innerHTML=Object.keys(LANGS).map(k=>`<option value="${k}"${k===lang?' selected':''}>${LANGS[k]}</option>`).join('');s.onchange=()=>{lang=s.value;S.set('ai_lang',lang);applyLang();}});
  $('ftitle').textContent=t(mode==='reg'?'regTitle':'logTitle');
  const u=cur();if(u){$('uname').textContent=u.name.split(' ')[0]+' · '+t('logout');}
  if(!$('site').classList.contains('hidden'))render();
}
/* ---------- auth ---------- */
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ai:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const users=()=>S.get('ai_users',[]);
const cur=()=>{const e=S.get('ai_session',null);return users().find(u=>u.email===e)||null};
function aerr(m){const e=$('aerr');e.textContent=m;e.classList.toggle('hidden',!m)}
function setMode(m){mode=m;$('fReg').classList.toggle('hidden',m!=='reg');$('fLog').classList.toggle('hidden',m!=='log');$('tReg').classList.toggle('on',m==='reg');$('tLog').classList.toggle('on',m==='log');aerr('');$('ftitle').textContent=t(m==='reg'?'regTitle':'logTitle')}
async function doReg(e){e.preventDefault();
  const n=$('rn').value.trim(),em=$('re').value.trim().toLowerCase(),p=$('rp').value;
  if(!n||!em||!p)return aerr(t('errFill'),false);
  if(p.length<6)return aerr(t('errPass'));
  if(users().some(u=>u.email===em))return aerr(t('errExists'));
  const us=users();us.push({id:'u'+Date.now(),name:n,email:em,hash:await hash(p)});S.set('ai_users',us);S.set('ai_session',em);start();return false}
async function doLog(e){e.preventDefault();
  const em=$('le').value.trim().toLowerCase(),h=await hash($('lp').value);
  const u=users().find(u=>u.email===em&&u.hash===h);
  if(!u)return aerr(t('errBad'));
  S.set('ai_session',em);start();return false}
function logout(){S.set('ai_session',null);start()}
function delAcc(){const u=cur();if(!u||!confirm(t('confirmDelAcc')))return;
  S.set('ai_users',users().filter(x=>x.id!==u.id));S.set('ai_session',null);start()}
/* logged-in users go straight to the site; no repeat registration */
function start(){const u=cur();$('auth').classList.toggle('hidden',!!u);$('site').classList.toggle('hidden',!u);
  if(!u){setMode(users().length?'log':'reg')}applyLang();window.scrollTo(0,0)}
/* ---------- gallery ---------- */
const frame=c=>'<!doctype html><body style="margin:0;display:grid;place-items:center;height:100vh;background:transparent;font-family:sans-serif">'+c;
function render(){
  const q=$('q').value.trim().toLowerCase(),u=cur();
  const list=icons().filter(i=>!q||i.name.toLowerCase().includes(q)||i.author.toLowerCase().includes(q));
  $('empty').classList.toggle('hidden',list.length>0);
  $('grid').innerHTML=list.map(i=>`<article class="ic"><iframe sandbox loading="lazy" title="${esc(i.name)}" srcdoc="${esc(frame(i.code))}"></iframe><div class="b"><span class="n">${esc(i.name)}</span><span class="a">${t('by')} ${esc(i.author)}</span><div class="act"><button class="btn sm" data-copy="${i.id}">${t('copy')}</button>${u&&i.owner===u.id?`<button class="btn sm dng" data-del="${i.id}">${t('del')}</button>`:''}</div></div></article>`).join('');
}
$('grid').addEventListener('click',async e=>{
  const c=e.target.closest('[data-copy]'),d=e.target.closest('[data-del]');
  if(c){const i=icons().find(x=>x.id===c.dataset.copy);try{await navigator.clipboard.writeText(i.code)}catch(_){const a=document.createElement('textarea');a.value=i.code;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(t('copied'))}
  if(d){const u=cur(),all=S.get('ai_icons',[]),i=all.find(x=>x.id===d.dataset.del);
    if(!u||!i||i.owner!==u.id||!confirm(t('confirmDelIcon')))return; /* only the owner can delete */
    S.set('ai_icons',all.filter(x=>x.id!==i.id));render()}
});
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
/* ---------- add icon ---------- */
function openAdd(){$('in').value='';$('ic').value='';$('merr').classList.add('hidden');prevIt();$('modal').classList.remove('hidden');$('in').focus()}
function closeAdd(){$('modal').classList.add('hidden')}
function prevIt(){$('pf').srcdoc=frame($('ic').value)}
function saveIcon(){const u=cur(),n=$('in').value.trim(),c=$('ic').value.trim();
  if(!u)return;if(!n||!c){$('merr').textContent=t('errName');$('merr').classList.remove('hidden');return}
  const all=S.get('ai_icons',[]);all.unshift({id:'i'+Date.now(),name:n,code:c,author:u.name,owner:u.id,ts:Date.now()});S.set('ai_icons',all);
  closeAdd();render();toast(t('saved'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAdd()});
start();
</script>
</body>
</html>
